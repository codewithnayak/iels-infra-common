apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: databases-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: "{{ .Values.ingress.className }}"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  tls:
    - hosts:
        - {{ .Values.ingress.hosts.postgres }}
        - {{ .Values.ingress.hosts.redis }}
      secretName: {{ .Values.ingress.tls.secretName }}

  rules:
    - host: {{ .Values.ingress.hosts.postgres }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: postgres-svc
                port:
                  number: {{ .Values.tcpPorts.postgres }}

    - host: {{ .Values.ingress.hosts.redis }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redis-svc
                port:
                  number: {{ .Values.tcpPorts.redis }}
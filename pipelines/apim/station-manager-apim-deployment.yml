trigger:
  - none

pool:
  vmImage: ubuntu-latest

variables:
  - name: AZURE_SUBSCRIPTION
    value: "YOUR-AZURE-SERVICE-CONNECTION"

  # APIM details
  - name: APIM_NAME
    value: "iels-apim"
  - name: APIM_RG
    value: "rg-iels-apim"

  # API details
  - name: API_NAME
    value: "station-manager-api"
  - name: API_DISPLAY_NAME
    value: "Station Manager API"
  - name: API_PATH
    value: "station"

  # Backend App Service
  - name: WEBAPP_NAME
    value: "iels-station-manager-app"
  - name: WEBAPP_RG
    value: "rg-iels-station"

steps:
  - task: AzureCLI@2
    displayName: "Create/Update APIM API"
    inputs:
      azureSubscription: "$(AZURE_SUBSCRIPTION)"
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        echo "Fetching App Service hostname..."
        BACKEND_URL=$(az webapp show \
          --name $(WEBAPP_NAME) \
          --resource-group $(WEBAPP_RG) \
          --query defaultHostName \
          -o tsv)

        echo "Creating/Updating API in APIM..."
        az apim api create \
          --resource-group $(APIM_RG) \
          --service-name $(APIM_NAME) \
          --api-id $(API_NAME) \
          --path "$(API_PATH)" \
          --display-name "$(API_DISPLAY_NAME)" \
          --protocols https \
          --service-url "https://${BACKEND_URL}"

        echo "API successfully created/updated."
